<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Your files in a locked folder on your own laptop">
  <title>Files locked on your device</title>
  <defs>
    <radialGradient id="v-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity="0.28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="v-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EFE9"/></linearGradient>
    <linearGradient id="v-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F5F0"/><stop offset="1" stop-color="#E9E5DB"/></linearGradient>
    <linearGradient id="v-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDEAE3"/><stop offset="1" stop-color="#D3CFC4"/></linearGradient>
    <linearGradient id="v-flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4EA"/><stop offset="1" stop-color="#FFDDBF"/></linearGradient>
    <linearGradient id="v-lock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="v-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#15803D"/></linearGradient>
  </defs>

  <ellipse cx="120" cy="184" rx="100" ry="10" fill="url(#v-shadow)"/>

  <!-- lid -->
  <rect x="40" y="26" width="160" height="126" rx="11" fill="url(#v-lid)" stroke="#0B1224" stroke-width="2"/>
  <rect x="50" y="36" width="140" height="106" rx="5" fill="url(#v-screen)"/>
  <circle cx="120" cy="31" r="1.6" fill="#0B1224"/>
  <!-- faint window chrome on screen -->
  <rect x="58" y="44" width="124" height="10" rx="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="64" cy="49" r="1.6" fill="#D9D5CA"/><circle cx="70" cy="49" r="1.6" fill="#D9D5CA"/><circle cx="76" cy="49" r="1.6" fill="#D9D5CA"/>

  <!-- folder -->
  <path d="M80 64 h24 a4 4 0 0 1 3 1.4 l6 7.1 h45 a5 5 0 0 1 5 5 v42 a5 5 0 0 1 -5 5 h-78 a5 5 0 0 1 -5 -5 v-50.5 a5 5 0 0 1 5 -5 z" fill="#FFFFFF" stroke="#0B1224" stroke-width="2" stroke-linejoin="round"/>
  <path d="M86 70 h60" stroke="#E4E0D6" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 84 a4 4 0 0 1 4 -4 h84 a4 4 0 0 1 4 4 v36.5 a5 5 0 0 1 -5 5 h-82 a5 5 0 0 1 -5 -5 z" fill="url(#v-flap)" stroke="#0B1224" stroke-width="2" stroke-linejoin="round"/>

  <!-- padlock -->
  <path d="M112 96 v-6.5 a8 8 0 0 1 16 0 v6.5" fill="none" stroke="#0B1224" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="106" y="95" width="28" height="23" rx="5.5" fill="url(#v-lock)" stroke="#0B1224" stroke-width="2"/>
  <path d="M110 99 v8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="120" cy="104.5" r="2.8" fill="#0B1224"/>
  <rect x="119" y="105" width="2" height="6" rx="1" fill="#0B1224"/>

  <!-- base -->
  <path d="M20 152 h200 l-8 15 a6 6 0 0 1 -5.3 3 H33.3 a6 6 0 0 1 -5.3 -3 z" fill="url(#v-base)" stroke="#0B1224" stroke-width="2" stroke-linejoin="round"/>
  <path d="M102 152 h36 v2 a3 3 0 0 1 -3 3 h-30 a3 3 0 0 1 -3 -3 z" fill="#C7C2B6"/>

  <!-- verified badge -->
  <circle cx="190" cy="36" r="17" fill="url(#v-ok)" stroke="#0B1224" stroke-width="2"/>
  <path d="M182.5 36.5 l5 5 l10 -10.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M30 60 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#FB923C"/>
  <path d="M214 96 l1.4 3.4 l3.4 1.4 l-3.4 1.4 l-1.4 3.4 l-1.4 -3.4 l-3.4 -1.4 l3.4 -1.4 z" fill="#C9CDD6"/>
</svg>
