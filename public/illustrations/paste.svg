<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img" aria-label="Copy the whole email from Amazon, then paste it into the box">
  <title>Copy the email, paste it here</title>
  <!-- email -->
  <rect x="14" y="18" width="92" height="74" rx="8" fill="#FFFFFF" stroke="#0F1728" stroke-width="2.5"/>
  <path d="M14 26 L60 58 L106 26" fill="none" stroke="#0F1728" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- copy -->
  <path d="M126 55 H166 M156 45 L166 55 L156 65" fill="none" stroke="#C9CDD6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clipboard -->
  <rect x="184" y="20" width="56" height="72" rx="7" fill="#F3EFE6" stroke="#0F1728" stroke-width="2.5"/>
  <rect x="198" y="12" width="28" height="14" rx="4" fill="#0F1728"/>
  <path d="M196 44 H228 M196 56 H222 M196 68 H226" stroke="#C9CDD6" stroke-width="3" stroke-linecap="round"/>
  <!-- paste -->
  <path d="M256 55 H292 M282 45 L292 55 L282 65" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- box with cursor -->
  <rect x="302" y="26" width="46" height="58" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M318 42 V68" stroke="#0F1728" stroke-width="2.5" stroke-linecap="round"/>
</svg>
