<svg role="img" aria-labelledby="t" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title id="t">AppealDeck</title>
  <style>
    /* The tab bar supplies the background, so the mark has none of its own: navy cards on a light
       tab, white cards on a dark one. Default is light, which is also the safe fallback for a
       renderer that does not evaluate the media query. */
    .deck-card { fill: #18212f; }
    .deck-check { stroke: #fb850e; }
    @media (prefers-color-scheme: dark) {
      .deck-card { fill: #ffffff; }
    }
  </style>
  <rect x="13.05" y="1.42" width="16.56" height="20.7" rx="3.6" class="deck-card" fill-opacity="0.34"/>
  <rect x="8.22" y="4.87" width="17.25" height="21.39" rx="3.6" class="deck-card" fill-opacity="0.62"/>
  <rect x="2.7" y="8.31" width="18.63" height="22.77" rx="3.9" class="deck-card"/>
  <path d="M7.39 20.6l3.86 3.86 7.31-8" fill="none" class="deck-check" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
