<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustrations · AppealDeck</title>
<link rel="stylesheet" href="../v5.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line) inset; background: #fff; }
  .pair > div { padding: 18px; display: flex; align-items: center; justify-content: center; height: 190px; }
  .pair .dk { background: radial-gradient(260px 160px at 80% 0%, rgba(234,88,12,0.3), transparent 70%), #0b1224; }
  .pair img { max-width: 100%; max-height: 100%; }
  figcaption { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; grid-column: 1 / -1; }
</style>
</head>
<body style="background:var(--paper)">
<main class="wrap" style="padding-top:56px;padding-bottom:80px;display:flex;flex-direction:column;gap:24px">
  <a href="../index.html">&#8592; Prototype contents</a>
  <h1 class="h2">Illustrations</h1>
  <p class="lede">One style: navy line, warm paper fills with soft gradients, one orange accent for the thing that matters. Each is shown on light and on the dark stage, because most sit on dark.</p>
  <div class="grid">
    <figure class="pair" style="margin:0"><div><img src="vault.svg" alt=""></div><div class="dk"><img src="vault.svg" alt=""></div><figcaption><strong>vault.svg</strong> · Vault banner, data page, case sidebar</figcaption></figure>
    <figure class="pair" style="margin:0"><div><img src="step-calendar.svg" alt=""></div><div class="dk"><img src="step-calendar.svg" alt=""></div><figcaption><strong>step-calendar.svg</strong> · Dashboard greeting</figcaption></figure>
    <figure class="pair" style="margin:0"><div><img src="step-checklist.svg" alt=""></div><div class="dk"><img src="step-checklist.svg" alt=""></div><figcaption><strong>step-checklist.svg</strong> · Decode: save as a case</figcaption></figure>
    <figure class="pair" style="margin:0"><div><img src="person-laptop.svg" alt=""></div><div class="dk"><img src="person-laptop.svg" alt=""></div><figcaption><strong>person-laptop.svg</strong> · Support (the one human figure)</figcaption></figure>
    <figure class="pair" style="margin:0"><div><img src="waiting.svg" alt="" style="width:72px"></div><div class="dk"><img src="waiting.svg" alt="" style="width:72px"></div><figcaption><strong>waiting.svg</strong> · Dashboard: a case waiting on Amazon</figcaption></figure>
  </div>
</main>
</body>
</html>
