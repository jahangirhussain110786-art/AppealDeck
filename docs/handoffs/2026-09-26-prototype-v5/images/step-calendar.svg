<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="A calendar with the due date circled and a clock">
  <title>Your due date, circled</title>
  <defs>
    <radialGradient id="c-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity="0.26"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="c-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F1EB"/></linearGradient>
    <linearGradient id="c-head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16203A"/><stop offset="1" stop-color="#0B1224"/></linearGradient>
    <linearGradient id="c-due" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="c-clock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7F0"/><stop offset="1" stop-color="#FFE3CC"/></linearGradient>
  </defs>

  <ellipse cx="120" cy="184" rx="96" ry="10" fill="url(#c-shadow)"/>

  <!-- page behind (stack) -->
  <rect x="54" y="40" width="148" height="128" rx="13" fill="#E6E2D8" stroke="#0B1224" stroke-width="2"/>
  <!-- main page -->
  <rect x="44" y="30" width="148" height="130" rx="13" fill="url(#c-page)" stroke="#0B1224" stroke-width="2"/>
  <path d="M44 43 a13 13 0 0 1 13 -13 h122 a13 13 0 0 1 13 13 v15 H44 z" fill="url(#c-head)"/>
  <text x="118" y="49" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#FFFFFF">SEPTEMBER</text>
  <!-- rings -->
  <rect x="75" y="20" width="8" height="20" rx="4" fill="#FFFFFF" stroke="#0B1224" stroke-width="2"/>
  <rect x="153" y="20" width="8" height="20" rx="4" fill="#FFFFFF" stroke="#0B1224" stroke-width="2"/>

  <!-- weekday letters -->
  <g font-family="Instrument Sans, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#8C95A8" text-anchor="middle">
    <text x="67" y="72">M</text><text x="93" y="72">T</text><text x="119" y="72">W</text><text x="145" y="72">T</text><text x="171" y="72">F</text>
  </g>
  <!-- past days (done) -->
  <g fill="#E7E3DA">
    <rect x="58" y="78" width="18" height="15" rx="4"/><rect x="84" y="78" width="18" height="15" rx="4"/><rect x="110" y="78" width="18" height="15" rx="4"/><rect x="136" y="78" width="18" height="15" rx="4"/><rect x="162" y="78" width="18" height="15" rx="4"/>
  </g>
  <g fill="none" stroke="#B8B3A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 85.5 l3 3 l5 -6"/><path d="M89 85.5 l3 3 l5 -6"/><path d="M115 85.5 l3 3 l5 -6"/><path d="M141 85.5 l3 3 l5 -6"/><path d="M167 85.5 l3 3 l5 -6"/>
  </g>
  <!-- this week and next -->
  <g fill="#F1EEE6">
    <rect x="58" y="100" width="18" height="15" rx="4"/><rect x="84" y="100" width="18" height="15" rx="4"/><rect x="136" y="100" width="18" height="15" rx="4"/><rect x="162" y="100" width="18" height="15" rx="4"/>
    <rect x="58" y="122" width="18" height="15" rx="4"/><rect x="84" y="122" width="18" height="15" rx="4"/><rect x="110" y="122" width="18" height="15" rx="4"/><rect x="136" y="122" width="18" height="15" rx="4"/><rect x="162" y="122" width="18" height="15" rx="4"/>
  </g>
  <!-- the due date -->
  <rect x="110" y="100" width="18" height="15" rx="4" fill="url(#c-due)"/>
  <text x="119" y="110.6" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">28</text>
  <path d="M104.5 104 c1 -9 29 -10 29.5 2.5 c0.5 10 -27 11 -30 1.5 c-0.6 -2 0.4 -4 2.5 -5.5" fill="none" stroke="#FB923C" stroke-width="2.4" stroke-linecap="round"/>

  <!-- clock -->
  <circle cx="186" cy="148" r="23" fill="url(#c-clock)" stroke="#0B1224" stroke-width="2"/>
  <g stroke="#0B1224" stroke-width="1.8" stroke-linecap="round"><path d="M186 129 v3"/><path d="M186 164 v3"/><path d="M167 148 h3"/><path d="M202 148 h3"/></g>
  <path d="M186 136 V148 l8 5" fill="none" stroke="#0B1224" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="148" r="2.2" fill="#EA580C"/>
</svg>
