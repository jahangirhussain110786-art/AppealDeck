name: Vercel Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel project info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      - name: Build for Vercel (artifacts)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token=$VERCEL_TOKEN
      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(vercel deploy --yes --prebuilt --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_OUTPUT"
        id: deploy
      - name: Comment PR with preview URL
        if: steps.deploy.outputs.DEPLOYMENT_URL != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            **Preview deployed** → ${{ steps.deploy.outputs.DEPLOYMENT_URL }}
            Lighthouse and e2e run against their own local production builds in CI.
