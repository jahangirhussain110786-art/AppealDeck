name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Production dependencies only: dev tooling is never shipped to a seller. A high advisory in what
      # does ship fails the build, so it is fixed the day it is published rather than found later.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:copy
      - run: npm run lint:reachability
      - run: npm run lint:sources
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      # A failed run that leaves no trace is only a red total. The report and every retry trace are
      # kept for 14 days so the failure can be read on a machine that is not the runner.
      - name: Upload the Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # The signed-in journey — a seller on a phone, the document reader with and without a Pass, and the
  # response errors. Those specs skip when no account is configured, which is why they never ran in
  # CI. They do run here, against a dedicated Supabase project and never production: they sign in and
  # use the account's allowances. The job is skipped until that project exists; see
  # docs/DEPLOYMENT.md §11a for the five secrets, the variable and the fixture account.
  e2e-signed-in:
    if: ${{ vars.E2E_SIGNED_IN == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Inlined into the build, so they must be present before `npm run build`, not only at runtime.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      DEV_LOGIN_EMAIL: ${{ secrets.E2E_DEV_LOGIN_EMAIL }}
      DEV_LOGIN_PASSWORD: ${{ secrets.E2E_DEV_LOGIN_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Every spec that signs in. 27 Oct 2026 audit: only three of them ran here, so a green CI could
      # not vouch for account continuity, backup restore, session refresh or the paid workspace.
      - run: >-
          npx playwright test
          e2e/case-mobile.spec.ts e2e/compose-errors.spec.ts e2e/device-reader.spec.ts
          e2e/integrity.spec.ts e2e/workspace.spec.ts e2e/backup-restore.spec.ts
          e2e/session-refresh.spec.ts e2e/supporting-surfaces.spec.ts e2e/keyboard-dark.spec.ts
          --project=chromium --retries=1 --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-signed-in.json
      # Specs skip themselves without credentials; say which ran, and fail if one ran nothing.
      - name: Report which signed-in specs ran and which skipped
        if: always()
        run: node scripts/check-e2e-skips.mjs playwright-signed-in.json
      - name: Upload the Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-signed-in
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run start &
      - run: npx --yes wait-on http://127.0.0.1:3000
      - run: npm run lighthouse
